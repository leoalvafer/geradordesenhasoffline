<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Escudo -->
  <path d="M256 96 L384 150 V260 C384 346 330 416 256 442 C182 416 128 346 128 260 V150 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>
  
  <!-- Símbolo de Fechadura / Cadeado -->
  <circle cx="256" cy="236" r="32" fill="#ffffff"/>
  <path d="M242 254 L236 312 H276 L270 254 Z" fill="#ffffff"/>
  
  <!-- Selo de verificação no canto inferior -->
  <g transform="translate(356, 356)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="4"/>
    <polyline points="-18 -2 -4 14 22 -14" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
